<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Campsite iPhone 가로 화면</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
body{margin:0}
button{font:inherit;color:inherit;border:0;padding:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.press{transition:transform 140ms cubic-bezier(0.22,1,0.36,1),background-color 140ms cubic-bezier(0.22,1,0.36,1)}
.press:active{transform:scale(0.92)}
.soft:hover{background-color:var(--raised)}
@keyframes moon{from{transform:translateX(-104%)}to{transform:translateX(104%)}}
@keyframes sky{0%{background-color:#e8b98a}30%{background-color:#9cc3e6}60%{background-color:#e59a6a}85%,100%{background-color:#141a2e}}
@keyframes sun{0%{transform:translate(-289px,102px)}30%{transform:translate(0px,-39px)}60%{transform:translate(289px,102px)}100%{transform:translate(289px,196px)}}
@keyframes tide{from{transform:scaleY(0.18)}to{transform:scaleY(1)}}
</style>
</helmet>
<div style="--bg: {{v.bg}}; --surf: {{v.surf}}; --raised: {{v.raised}}; --fg: {{v.fg}}; --fg2: {{v.fg2}}; --fg3: {{v.fg3}}; --lift: {{v.lift}}; --acc: {{v.acc}}; --off: {{v.off}}; position: relative; width: 852px; height: 393px; overflow: hidden; background: var(--bg); color: var(--fg); font-family: 'IBM Plex Sans KR', system-ui, sans-serif; font-size: 15px; line-height: 22px; user-select: none; -webkit-user-select: none">

  <!-- 왼쪽: 세로 레일. 작품이 물러났을 때만 드러난다 -->
  <nav aria-label="캠프" style="position: absolute; left: 63px; top: 32px; width: 68px; box-sizing: border-box; padding: 8px; border-radius: 34px; background: var(--surf); box-shadow: var(--lift); display: flex; flex-direction: column; align-items: center; gap: 8px; opacity: {{chOp}}; transform: {{fromLeft}}; pointer-events: {{chPe}}; transition: opacity 200ms linear, transform 520ms cubic-bezier(0.3,1.4,0.5,1)">
    <div onPointerDown="{{rd}}" onPointerMove="{{rm}}" onPointerUp="{{ru}}" onPointerCancel="{{ru}}" style="position: relative; width: 52px; height: 156px; border-radius: 26px; overflow: hidden; touch-action: none; cursor: grab">
      <div style="position: absolute; left: 4px; top: 50%; width: 44px; margin-top: -22px; display: flex; flex-direction: column; gap: 12px; transform: {{railTf}}; transition: {{railTr}}">
        <sc-for list="{{disks}}" as="k" hint-placeholder-count="5">
          <span role="img" aria-label="{{k.camp}}" style="position: relative; flex: none; width: 44px; height: 44px; border-radius: 50%; background: {{k.ground}}; box-shadow: {{k.ring}}; opacity: {{k.op}}; transition: opacity 200ms linear, box-shadow 160ms cubic-bezier(0.22,1,0.36,1); display: flex; align-items: center; justify-content: center">
            <sc-if value="{{k.isMoon}}" hint-placeholder-val="{{true}}"><span style="width: 20px; height: 20px; border-radius: 50%; background: {{k.a}}"></span></sc-if>
            <sc-if value="{{k.isDay}}" hint-placeholder-val="{{false}}"><span style="width: 20px; height: 20px; border-radius: 50%; background: #fff3d6"></span></sc-if>
            <sc-if value="{{k.isTide}}" hint-placeholder-val="{{false}}"><span style="display: flex; align-items: flex-end; gap: 4px; height: 20px"><span style="width: 4px; height: 8px; border-radius: 2px; background: {{k.a}}"></span><span style="width: 4px; height: 20px; border-radius: 2px; background: {{k.a}}"></span><span style="width: 4px; height: 12px; border-radius: 2px; background: {{k.a}}"></span></span></sc-if>
          </span>
        </sc-for>
      </div>
    </div>
    <button aria-label="캠프 추가" class="press" style="flex: none; width: 52px; height: 52px; border-radius: 50%; background: var(--raised); display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: var(--fg); stroke-width: 1.5; stroke-linecap: round"><path d="M12 5v14M5 12h14"></path></svg>
    </button>
  </nav>

  <!-- 오른쪽: 계정과 동작 -->
  <div style="position: absolute; left: 727px; top: 16px; width: 52px; height: 265px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; opacity: {{chOp}}; transform: {{fromRight}}; pointer-events: {{chPe}}; transition: opacity 200ms linear, transform 520ms cubic-bezier(0.3,1.4,0.5,1)">
    <button aria-label="내 캠프 열기" class="press" style="width: 44px; height: 44px; border-radius: 50%; background: var(--surf); box-shadow: var(--lift); display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: var(--fg); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round"><circle cx="12" cy="8" r="4"></circle><path d="M4 20c1.5-3.5 4.5-5 8-5s6.5 1.5 8 5"></path></svg>
    </button>
    <div style="display: flex; flex-direction: column; gap: 4px; padding: 4px; width: 52px; box-sizing: border-box; border-radius: 26px; background: var(--surf); box-shadow: var(--lift)">
      <button aria-label="좋아요" aria-pressed="{{cur.liked}}" onClick="{{like}}" class="soft press" style="width: 44px; height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center">
        <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" style="fill: {{heartFill}}; stroke: {{heartStroke}}; stroke-width: 1.5; stroke-linejoin: round; transform: {{heartTf}}; transition: transform 380ms cubic-bezier(0.3,1.4,0.5,1)"><path d="M12 20.5s-7.5-4.6-7.5-10.4A4.3 4.3 0 0 1 12 7.4a4.3 4.3 0 0 1 7.5 2.7c0 5.8-7.5 10.4-7.5 10.4z"></path></svg>
      </button>
      <button aria-label="저장" aria-pressed="{{cur.saved}}" onClick="{{save}}" class="soft press" style="width: 44px; height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center">
        <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" style="fill: {{saveFill}}; stroke: var(--fg); stroke-width: 1.5; stroke-linejoin: round; transform: {{saveTf}}; transition: transform 380ms cubic-bezier(0.3,1.4,0.5,1)"><path d="M6.5 4h11v16.5L12 16.3l-5.5 4.2z"></path></svg>
      </button>
      <button aria-label="공유하기" class="soft press" style="width: 44px; height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center">
        <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: var(--fg); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round"><path d="M12 15V3.5M7.5 8L12 3.5 16.5 8M5.5 12v8.5h13V12"></path></svg>
      </button>
    </div>
    <span style="width: 44px; height: 44px"></span>
  </div>

  <!-- 아래: 편 수, 탭, 제목 -->
  <div style="position: absolute; left: 139px; top: 293px; width: 574px; height: 4px; display: flex; justify-content: center; gap: 6px; opacity: {{chOp}}; transition: opacity 200ms linear">
    <sc-for list="{{segs}}" as="g" hint-placeholder-count="3">
      <span style="flex: none; width: {{g.w}}; height: 4px; border-radius: 2px; background: {{g.bg}}; overflow: hidden; transition: width 420ms cubic-bezier(0.3,1.4,0.5,1)"><span style="display: block; width: 100%; height: 4px; border-radius: 2px; background: var(--fg); transform-origin: 0 50%; transform: {{g.tf}}; opacity: {{g.op}}"></span></span>
    </sc-for>
  </div>
  <div style="position: absolute; left: 139px; top: 305px; width: 574px; height: 44px; display: flex; align-items: center; gap: 16px; opacity: {{chOp}}; transform: {{fromBelow}}; pointer-events: {{chPe}}; transition: opacity 200ms linear, transform 520ms cubic-bezier(0.3,1.4,0.5,1)">
    <div role="tablist" style="flex: none; display: flex; gap: 4px; padding: 4px; height: 44px; box-sizing: border-box; border-radius: 22px; background: var(--surf); box-shadow: var(--lift)">
      <sc-for list="{{modes}}" as="m" hint-placeholder-count="2">
        <button role="tab" aria-selected="{{m.on}}" onClick="{{m.pick}}" class="press" style="height: 36px; padding: 0 16px; border-radius: 18px; font-weight: 500; background: {{m.bg}}; color: {{m.fg}}">{{m.label}}</button>
      </sc-for>
    </div>
    <div style="order: -1; flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; text-align: left">
      <span style="font-size: 13px; line-height: 20px; color: var(--fg2)">{{cur.camp}}</span>
      <span style="max-width: 100%; font-size: 15px; line-height: 22px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{cur.title}}</span>
    </div>
  </div>

  <!-- 무대: 재생 중에는 화면 전체, 누르면 물러나 조작부에 자리를 내준다 -->
  <div role="group" aria-label="작품" onPointerDown="{{pd}}" onPointerMove="{{pm}}" onPointerUp="{{pu}}" onPointerCancel="{{pu}}" style="position: absolute; left: 0; top: 0; width: 852px; height: 393px; overflow: hidden; transform-origin: 0 0; transform: {{stageTf}}; border-radius: {{stageR}}; transition: transform 560ms cubic-bezier(0.3,1.25,0.5,1), border-radius 320ms cubic-bezier(0.22,1,0.36,1); touch-action: none; cursor: grab">
    <sc-for list="{{cards}}" as="c" hint-placeholder-count="3">
      <div style="position: absolute; inset: 0; overflow: hidden; color: #ededed; background: {{c.ground}}; transform: {{c.tf}}; transition: {{c.tr}}">
        <sc-if value="{{c.isMoon}}" hint-placeholder-val="{{true}}">
          <div style="position: absolute; right: 102px; top: 98px; width: 196px; height: 196px; border-radius: 50%; overflow: hidden; background: {{c.a}}">
            <div style="width: 196px; height: 196px; border-radius: 50%; background: {{c.ground}}; transform: translateX(-104%); animation: {{c.anim}} 12s linear infinite; animation-play-state: {{c.play}}"></div>
          </div>
          <div style="position: absolute; left: 83px; top: 0; bottom: 0; display: flex; flex-direction: column; justify-content: center; gap: 8px">
            <span style="font-size: 13px; line-height: 22px; color: {{c.ink}}">{{c.camp}}</span>
            <span style="font-size: 32px; line-height: 40px; font-weight: 500; letter-spacing: -0.02em">{{c.short}}</span>
            <span style="font-size: 13px; line-height: 22px; color: {{c.ink}}">{{c.cap}}</span>
          </div>
        </sc-if>
        <sc-if value="{{c.isDay}}" hint-placeholder-val="{{false}}">
          <div style="position: absolute; inset: 0; background-color: #e8b98a; animation: {{c.animSky}} 12s linear infinite; animation-play-state: {{c.play}}"></div>
          <div style="position: absolute; left: 50%; top: 117px; width: 56px; height: 56px; margin-left: -28px; border-radius: 50%; background: #fff3d6; transform: translate(-289px,102px); animation: {{c.animSun}} 12s cubic-bezier(0.4,0,0.6,1) infinite; animation-play-state: {{c.play}}"></div>
          <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 116px; box-sizing: border-box; padding: 0 83px; background: #16181d; box-shadow: inset 0 1px 0 rgba(255,255,255,0.12); display: flex; align-items: center; justify-content: space-between; gap: 24px">
            <span style="font-size: 32px; line-height: 40px; font-weight: 500; letter-spacing: -0.02em">{{c.short}}</span>
            <span style="font-size: 13px; line-height: 22px; color: #a1a1a6">{{c.cap}}</span>
          </div>
        </sc-if>
        <sc-if value="{{c.isTide}}" hint-placeholder-val="{{false}}">
          <div style="position: absolute; left: 83px; top: 24px; display: flex; flex-direction: column; gap: 8px">
            <span style="font-size: 13px; line-height: 22px; color: {{c.ink}}">{{c.camp}}</span>
            <span style="font-size: 32px; line-height: 40px; font-weight: 500; letter-spacing: -0.02em">{{c.short}}</span>
          </div>
          <div style="position: absolute; left: 83px; right: 83px; bottom: 68px; height: 180px; display: flex; align-items: flex-end; justify-content: space-between">
            <sc-for list="{{c.bars}}" as="b" hint-placeholder-count="21">
              <span style="width: 12px; height: 180px; border-radius: 6px; background: {{c.a}}; transform-origin: 50% 100%; transform: scaleY(0.18); animation: {{c.anim}} 2.4s cubic-bezier(0.45,0,0.55,1) infinite alternate; animation-delay: {{b.d}}; animation-play-state: {{c.play}}"></span>
            </sc-for>
          </div>
          <span style="position: absolute; left: 83px; bottom: 28px; font-size: 13px; line-height: 22px; color: {{c.ink}}">{{c.cap}}</span>
        </sc-if>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","default":"dark","options":["dark","light"]},"seconds":{"editor":"range","default":12,"min":6,"max":20,"step":1,"unit":"s"},"$preview":{"width":852,"height":393}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { camp: 0, eps: {}, dx: 0, dy: 0, dragging: false, t: 0, playing: true, liked: {}, saved: {}, mode: 0 };
    this.G = { W: 852, H: 393, cx: 139, cy: 16, k: 0.6737, r: 24, win: 156 };
    this.SX = 852 + 24; this.SY = 393 + 24; this.SLOT = 56; this.p = null;
    const m = (short, cap, title) => ({ kind: 'moon', short, cap, title: title || short });
    const w = (short, cap) => ({ kind: 'tide', short, cap, title: short });
    this.camps = [
      { id: 0, camp: '밤하늘', ground: '#0b0d14', ink: '#a3a9b8', a: '#e9e6df', vistas: [m('달의 위상', '보름에서 그믐으로, 다시 보름으로', '보름에서 그믐까지, 스물아홉 날 동안의 달의 위상'), m('월식', '지구의 그림자가 지나가는 밤'), m('초승', '가장 가는 빛')] },
      { id: 1, camp: '하루', ground: '#16181d', ink: '#a1a1a6', a: '#e8b98a', vistas: [{ kind: 'day', short: '낮과 밤', cap: '해가 뜨고 지는 동안의 하늘빛', title: '낮과 밤' }, w('그림자의 길이', '정오에 가장 짧다')] },
      { id: 2, camp: '바다', ground: '#10201f', ink: '#9fb8b3', a: '#7fd1c2', vistas: [w('파도의 주기', '밀려오고 물러나는 간격'), w('밀물과 썰물', '하루 두 번 오르내리는 물'), m('등대', '한 바퀴 도는 빛')] },
      { id: 3, camp: '하늘', ground: '#14100a', ink: '#b8ab98', a: '#f3c58f', vistas: [m('일식', '해가 가려졌다가 돌아오는 동안'), w('노을의 층', '빛이 낮아지는 순서')] },
      { id: 4, camp: '들판', ground: '#17170f', ink: '#b5b29a', a: '#d9c27a', vistas: [w('바람의 결', '풀이 눕고 일어서는 박자'), m('보름 들판', '달빛이 차오르는 밤')] }
    ];
  }
  componentDidMount() {
    this.timer = setInterval(() => {
      const s = this.state; if (!s.playing || s.dragging) return;
      const dur = this.props.seconds ?? 12; const t = s.t + 0.1;
      if (t < dur) { this.setState({ t }); return; }
      const c = this.camps[s.camp]; const ep = s.eps[c.id] || 0;
      if (ep < c.vistas.length - 1) this.setEp(ep + 1, true); else this.setCamp(s.camp < this.camps.length - 1 ? s.camp + 1 : 0, true);
    }, 100);
  }
  componentWillUnmount() { clearInterval(this.timer); }
  setCamp(camp, play) { const s = this.state; if (camp === s.camp) this.setState({ dx: 0, dy: 0, dragging: false }); else this.setState({ camp, dx: 0, dy: 0, dragging: false, t: 0, playing: play ?? s.playing }); }
  setEp(ep, play) { const s = this.state; this.setState({ eps: { ...s.eps, [this.camps[s.camp].id]: ep }, dx: 0, dy: 0, dragging: false, t: 0, playing: play ?? s.playing }); }
  renderVals() {
    const s = this.state; const G = this.G; const dur = this.props.seconds ?? 12;
    const dark = (this.props.theme ?? 'dark') === 'dark'; const spring = 'cubic-bezier(0.3,1.25,0.5,1)';
    const SX = this.SX, SY = this.SY, SLOT = this.SLOT; const list = this.camps; const n = list.length;
    const v = dark
      ? { bg: '#0f0f10', surf: '#19191b', raised: '#232325', fg: '#ededed', fg2: '#a1a1a6', fg3: '#85858b', lift: 'inset 0 1px 0 rgba(255,255,255,0.12)', acc: '#f0a47c', off: '#2e2e31' }
      : { bg: '#f4f4f5', surf: '#ffffff', raised: '#f4f4f5', fg: '#171717', fg2: '#525252', fg3: '#737373', lift: '0 1px 2px rgba(0,0,0,0.05), 0 0 0 1px rgba(23,23,23,0.06)', acc: '#c2562a', off: '#d4d4d8' };
    const kinds = (k) => ({ isMoon: k === 'moon', isDay: k === 'day', isTide: k === 'tide' });
    const epOf = (c) => s.eps[c.id] || 0;
    const here = list[s.camp]; const ep = epOf(here); const last = here.vistas.length - 1;
    const move = s.dragging ? 'none' : 'transform 560ms ' + spring;
    const cards = [];
    list.forEach((c, ci) => c.vistas.forEach((vi, ei) => {
      const x = (ci - s.camp) * SX + s.dx; const y = (ei - epOf(c)) * SY + (ci === s.camp ? s.dy : 0);
      const on = ci === s.camp && ei === ep; const run = on && !s.dragging;
      const scale = 1 - Math.min(Math.abs(x) / SX, 1) * 0.06 - Math.min(Math.abs(y) / SY, 1) * 0.06;
      cards.push({ ...vi, ...kinds(vi.kind), camp: c.camp, ground: c.ground, ink: c.ink, a: c.a,
        tf: 'translate(' + x + 'px,' + y + 'px) scale(' + scale.toFixed(4) + ')', tr: move,
        anim: run ? vi.kind : 'none', animSky: run ? 'sky' : 'none', animSun: run ? 'sun' : 'none',
        play: s.playing ? 'running' : 'paused',
        bars: Array.from({ length: 21 }, (_, k) => ({ d: (-k * 0.22).toFixed(2) + 's' })) });
    }));
    const f = s.camp - s.dx / SX;
    const disks = list.map((c, i) => { const dist = Math.abs(i - f); return { ...kinds(c.vistas[0].kind), camp: c.camp, ground: c.ground, a: c.a, op: Math.max(0.4, 1 - 0.2 * dist).toFixed(2), ring: dist < 0.5 ? '0 0 0 2px ' + v.surf + ', 0 0 0 4px ' + v.fg : 'inset 0 0 0 1px rgba(255,255,255,0.12)' }; });
    const segs = here.vistas.map((_, i) => { const on = i === ep; return { w: on ? '120px' : '4px', bg: v.off, op: on ? 1 : 0, tf: 'scaleX(' + (s.t / dur).toFixed(4) + ')' }; });
    const key = here.id + '-' + ep; const vista = here.vistas[ep];
    const cur = { camp: here.camp, title: vista.title, liked: !!s.liked[key], saved: !!s.saved[key] };
    const band = (d, atStart, atEnd) => ((d > 0 && atStart) || (d < 0 && atEnd) ? d * 0.3 : d);
    const open = !s.playing;
    return {
      v, cards, disks, segs, cur,
      stageTf: open ? 'translate(' + G.cx + 'px,' + G.cy + 'px) scale(' + G.k + ')' : 'translate(0px,0px) scale(1)',
      stageR: open ? (G.r / G.k).toFixed(1) + 'px' : '0px',
      chOp: open ? 1 : 0, chPe: open ? 'auto' : 'none',
      fromLeft: open ? 'translateX(0px)' : 'translateX(-32px)', fromRight: open ? 'translateX(0px)' : 'translateX(32px)', fromBelow: open ? 'translateY(0px)' : 'translateY(24px)',
      railTf: 'translateY(' + (-f * SLOT).toFixed(1) + 'px)', railTr: s.dragging ? 'none' : 'transform 520ms ' + spring,
      modes: ['For Me', '발견'].map((label, i) => ({ label, on: s.mode === i, bg: s.mode === i ? v.fg : 'transparent', fg: s.mode === i ? v.bg : v.fg2, pick: () => this.setState({ mode: i }) })),
      heartFill: cur.liked ? v.acc : 'none', heartStroke: cur.liked ? v.acc : v.fg, heartTf: cur.liked ? 'scale(1.16)' : 'scale(1)',
      saveFill: cur.saved ? v.fg : 'none', saveTf: cur.saved ? 'scale(1.16)' : 'scale(1)',
      like: () => this.setState({ liked: { ...s.liked, [key]: !s.liked[key] } }),
      save: () => this.setState({ saved: { ...s.saved, [key]: !s.saved[key] } }),
      pd: (e) => { e.currentTarget.setPointerCapture(e.pointerId); const r = e.currentTarget.getBoundingClientRect(); this.p = { x: e.clientX, y: e.clientY, at: Date.now(), k: G.W / Math.max(r.width, 1), axis: null }; },
      pm: (e) => {
        const p = this.p; if (!p) return; const dx = (e.clientX - p.x) * p.k, dy = (e.clientY - p.y) * p.k;
        if (!p.axis) { if (Math.max(Math.abs(dx), Math.abs(dy)) < 10) return; p.axis = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y'; }
        if (p.axis === 'x') this.setState({ dx: band(dx, s.camp === 0, s.camp === n - 1), dy: 0, dragging: true });
        else this.setState({ dy: band(dy, ep === 0, ep === last), dx: 0, dragging: true });
      },
      pu: (e) => {
        const p = this.p; this.p = null; if (!p) return;
        if (!p.axis) { this.setState({ playing: !this.state.playing }); return; }
        const d = (p.axis === 'x' ? e.clientX - p.x : e.clientY - p.y) * p.k; const vel = d / Math.max(Date.now() - p.at, 1);
        const span = p.axis === 'x' ? SX : SY; const go = Math.abs(d) > span * 0.16 || (Math.abs(vel) > 0.5 && Math.abs(d) > 24); const step = go ? (d < 0 ? 1 : -1) : 0;
        if (p.axis === 'x') this.setCamp(Math.max(0, Math.min(n - 1, s.camp + step)));
        else { const to = Math.max(0, Math.min(last, ep + step)); if (to === ep) this.setState({ dx: 0, dy: 0, dragging: false }); else this.setEp(to); }
      },
      rd: (e) => { e.currentTarget.setPointerCapture(e.pointerId); const r = e.currentTarget.getBoundingClientRect(); this.q = { y: e.clientY, at: Date.now(), k: G.win / Math.max(r.height, 1), mid: r.top + r.height / 2, moved: false }; },
      rm: (e) => {
        const q = this.q; if (!q) return; const d = (e.clientY - q.y) * q.k;
        if (!q.moved && Math.abs(d) < 6) return; q.moved = true;
        const to = Math.max(-0.3, Math.min(n - 0.7, s.camp - d / SLOT));
        this.setState({ dx: (s.camp - to) * SX, dy: 0, dragging: true });
      },
      ru: (e) => {
        const q = this.q; this.q = null; if (!q) return; const d = (e.clientY - q.y) * q.k;
        const to = q.moved ? s.camp - (d + (d / Math.max(Date.now() - q.at, 1)) * 160) / SLOT : s.camp + ((e.clientY - q.mid) * q.k) / SLOT;
        this.setCamp(Math.max(0, Math.min(n - 1, Math.round(to))));
      }
    };
  }
}
